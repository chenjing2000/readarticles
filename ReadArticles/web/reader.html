<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadArticles</title>
  <link rel="stylesheet" href="reader.css">
  <script type="module" src="reader.js"></script>
</head>
<body>
  <div class="workspace">
    <section class="pane article-pane" aria-label="文章正文">
      <main id="article-scroll" class="scroll">
        <h1 id="article-title"></h1>
        <div id="article-body" aria-live="off">
          <p class="empty">阅读界面正在初始化…</p>
        </div>
      </main>
      <footer class="toolbar">
        <label class="progress-label"><input id="progress" aria-label="文章音频进度" type="range" min="0" max="1" step="0.05" value="0" disabled></label>
        <output id="playback-time">00:00 / 00:00</output>
        <button id="article-play" disabled title="播放或暂停文章音频" aria-label="播放或暂停文章音频"><img src="icons/play.svg" alt=""></button>
        <button id="article-stop" disabled title="停止文章音频" aria-label="停止文章音频"><img src="icons/stop.svg" alt=""></button>
      </footer>
      <aside id="notifications" aria-label="通知">
        <div id="notification-cards" class="notification-cards"></div>
      </aside>
    </section>
    <div id="reader-splitter" class="reader-splitter" role="separator"
         aria-label="调整词汇区宽度" aria-orientation="vertical" tabindex="0"></div>
    <section class="pane vocabulary-pane" aria-label="词汇表">
      <div id="vocabulary-scroll" class="scroll">
        <div class="pane-heading">词汇表 <span id="vocabulary-count"></span></div>
        <div id="vocabulary-list"></div>
      </div>
      <footer class="toolbar vocabulary-toolbar">
        <button id="word-up" disabled title="上移所选词汇" aria-label="上移所选词汇"><img src="icons/move-up.svg" alt=""></button>
        <button id="word-down" disabled title="下移所选词汇" aria-label="下移所选词汇"><img src="icons/move-down.svg" alt=""></button>
        <button id="word-delete" disabled title="删除所选词汇" aria-label="删除所选词汇"><img src="icons/delete.svg" alt=""></button>
        <button id="script-toggle" disabled aria-pressed="false" title="切换 Passage/Script 阅读模式" aria-label="切换 Passage/Script 阅读模式"><img src="icons/show-script.svg" alt=""></button>
        <button id="highlight-toggle" aria-pressed="false" title="切换正文词汇高亮" aria-label="切换正文词汇高亮"><img src="icons/not-show-vocabulary.svg" alt=""></button>
        <button id="word-import" disabled title="导入词汇 JSON（替换当前词表）" aria-label="导入词汇 JSON（替换当前词表）"><img src="icons/import.svg" alt=""></button>
      </footer>
    </section>
    <button type="button" id="selection-add" class="selection-add" hidden
            aria-label="添加所选词汇" title="添加所选词汇"><img src="icons/selection-add.svg" alt=""></button>
  </div>
</body>
</html>
