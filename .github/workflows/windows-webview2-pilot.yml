name: WebView2 pilot Windows smoke

on:
  push:
    branches: [feature/webview2-reader]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: dotnet build ReadArticles -c Release
      - name: Check embedded browser assets
        run: dotnet run --project ReadArticles.Tests -c Release -- --webview-pilot-only
      - name: Verify protected single-file publish
        shell: pwsh
        run: .\tools\Publish.ps1
