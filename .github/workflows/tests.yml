name: Windows tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build application
        shell: powershell
        run: dotnet build ReadArticles -c Release
      - name: Run UI regression suite
        shell: powershell
        run: .\tools\Test.ps1 -Suite UI
