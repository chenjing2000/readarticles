name: Windows tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  full-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run full regression suite
        shell: powershell
        run: .\\tools\\Test.ps1 -Suite Full
